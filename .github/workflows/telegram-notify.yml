name: Telegram Notification

# =====================================================================
# GitHub 指定提交 / 发版推送至 Telegram 群工作流
# 触发机制：
# 1. 发布正式 Release 时自动推送版本卡片
# 2. 在 GitHub Actions 页面手动点击「Run workflow」指定 Commit SHA 推送
# (取消合并 master 自动推送，彻底由你精确控制何时推送、推送哪次提交)
# =====================================================================

on:
  # 1. 当在 GitHub 发布新 Release 时自动触发推送（正式大版本发版）
  release:
    types: [published]

  # 2. 支持在 GitHub Actions 页面手动指定提交推送
  workflow_dispatch:
    inputs:
      commit_sha:
        description: '指定要推送的 Commit SHA（如 c19cda7，留空则默认推送最新一次）'
        required: false
        default: ''
      extra_note:
        description: '可选：额外补充寄语（会置顶展示在消息上方）'
        required: false
        default: ''

jobs:
  telegram-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send Notification via Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COMMIT_SHA: ${{ github.event.inputs.commit_sha }}
          INPUT_EXTRA_NOTE: ${{ github.event.inputs.extra_note }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/scripts/send_telegram.py
