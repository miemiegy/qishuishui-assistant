name: Telegram Notification

# =====================================================================
# GitHub 更新指定推送至 Telegram 群工作流
# 触发机制：
# 1. 发布正式 Release 时自动推送版本卡片
# 2. 在 GitHub Actions 页面手动点击「Run workflow」指定推送
# (已取消合并 master 自动推送，避免日常代码提交打扰群友)
# =====================================================================

on:
  # 1. 当在 GitHub 发布新 Release 时自动触发推送（发版推荐）
  release:
    types: [published]

  # 2. 支持在 GitHub Actions 页面手动指定推送
  workflow_dispatch:
    inputs:
      title:
        description: '通知标题'
        required: false
        default: '【汽水水助手】版本更新通知'
      message:
        description: '通知正文内容'
        required: true
        default: '汽水水助手已发布最新更新，欢迎体验！'

jobs:
  telegram-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification via Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. 检查 Secrets 是否已配置
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "❌ 错误: 未检测到 TELEGRAM_BOT_TOKEN 或 TELEGRAM_CHAT_ID！"
            echo "请前往 GitHub 仓库: Settings -> Secrets and variables -> Actions 添加这两个配置。"
            exit 1
          fi

          # 2. 根据不同触发事件生成对应的 HTML 消息内容
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            NAME="${{ github.event.release.name }}"
            URL="${{ github.event.release.html_url }}"
            BODY="${{ github.event.release.body }}"
            
            MSG="🚀 <b>【汽水水助手】新版本发布！</b>%0A%0A"
            MSG+="🏷 <b>版本号</b>：<code>${TAG}</code>%0A"
            MSG+="📌 <b>发布标题</b>：${NAME}%0A"
            MSG+="👤 <b>发布者</b>：${{ github.actor }}%0A%0A"
            if [ -n "$BODY" ]; then
              MSG+="📝 <b>更新说明</b>：%0A${BODY}%0A%0A"
            fi
            MSG+="🔗 <a href='${URL}'>点击直达 GitHub Release 页面</a>"

          else
            # workflow_dispatch 手动指定推送
            TITLE="${{ github.event.inputs.title }}"
            CONTENT="${{ github.event.inputs.message }}"

            MSG="📢 <b>${TITLE}</b>%0A%0A"
            MSG+="📝 <b>通知内容</b>：%0A${CONTENT}%0A%0A"
            MSG+="👤 <b>操作者</b>：${{ github.actor }}%0A"
            MSG+="🔗 <a href='${{ github.server_url }}/${{ github.repository }}'>项目仓库主页</a>"
          fi

          # 3. 调用 Telegram Bot API 发送消息 (采用 HTML 模式，杜绝字符转义报错)
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true")

          echo "Telegram API Response: $RESPONSE"

          # 4. 校验发送结果
          OK=$(echo "$RESPONSE" | grep -o '"ok":true' || true)
          if [ -z "$OK" ]; then
            echo "❌ 消息发送失败，请检查："
            echo "1. TELEGRAM_BOT_TOKEN 是否正确；"
            echo "2. TELEGRAM_CHAT_ID 是否正确；"
            echo "3. 机器人是否已被拉入电报群并赋予发言权限！"
            exit 1
          fi

          echo "✔ Telegram 消息推送成功！"
